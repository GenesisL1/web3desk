name: Finalize Insights migration cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-insights-migration.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-insights-migration
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Web3Desk scope
        run: |
          rm -rf decentralization molnft-evidence
          rm -f .github/workflows/capture-decentralization.yml
          rm -f .github/workflows/capture-molnft-evidence.yml
          rm -f .github/workflows/cleanup-insights-migration.yml
          grep -q 'GenesisL1/insights' README.md

      - name: Close obsolete evidence migration pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --limit 100 --json number,title \
            | jq -r '.[] | select(.title | test("MOLNFT evidence|decentralization evidence|pinned MOLNFT|evidence capture"; "i")) | .number' \
            | while read -r number; do
                [ -n "$number" ] && gh pr close "$number" --comment "Superseded by the dedicated GenesisL1/insights repository."
              done

      - name: Remove one-use workflow and commit
        run: |
          rm -f .github/workflows/finalize-insights-migration.yml
          git config user.name "GenesisL1 Repository Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Web3Desk is already clean."
          else
            git commit -m "chore: finalize Insights repository migration"
            git push
          fi
