name: Capture pinned MOLNFT evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "molnft-evidence/scripts/capture_molnft_snapshot.py"
      - "molnft-evidence/METHODOLOGY.md"
      - ".github/workflows/capture-molnft-evidence.yml"

permissions:
  contents: write

concurrency:
  group: molnft-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evidence dependencies
        run: python -m pip install --disable-pip-version-check requests eth-abi eth-utils 'eth-hash[pycryptodome]' msgpack

      - name: Verify Keccak selector backend
        run: python -c "from eth_utils import keccak; assert keccak(text='totalSupply()')[:4].hex() == '18160ddd'"

      - name: Normalize contract base64 before decoding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('molnft-evidence/scripts/capture_molnft_snapshot.py')
          text = path.read_text()
          old = 'base64.b64decode(combined_b64, validate=True)'
          new = 'base64.b64decode(combined_b64)'
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('expected base64 decoder expression was not found')
          PY

      - name: Capture block-pinned MOLNFT evidence
        run: |
          python molnft-evidence/scripts/capture_molnft_snapshot.py \
            --block 13412747 \
            --expected-block-hash 19F42CD995E384E09D5CD4FB2751668E613D762DD1F22301D065EC84950F0F9A

      - name: Resolve generated snapshot directory
        id: snapshot
        run: |
          SNAPSHOT=$(python - <<'PY'
          import json
          from pathlib import Path
          pointer = json.loads(Path('molnft-evidence/latest.json').read_text())
          print('molnft-evidence/snapshots/' + pointer['snapshot_directory'])
          PY
          )
          echo "path=${SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Verify SHA-256 manifest
        run: cd "${{ steps.snapshot.outputs.path }}" && sha256sum -c SHA256SUMS.txt

      - name: Build a permanent downloadable archive
        run: |
          mkdir -p molnft-evidence/releases
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path('.')
          pointer = json.loads(Path('molnft-evidence/latest.json').read_text())
          snapshot = Path('molnft-evidence/snapshots') / pointer['snapshot_directory']
          output = Path('molnft-evidence/releases/GenesisL1_MOLNFT_Evidence_Block_13412747.zip')
          if output.exists():
              output.unlink()
          sources = [
              snapshot,
              Path('molnft-evidence/latest.json'),
              Path('molnft-evidence/README.md'),
              Path('molnft-evidence/METHODOLOGY.md'),
              Path('molnft-evidence/scripts/capture_molnft_snapshot.py'),
              Path('.github/workflows/capture-molnft-evidence.yml'),
          ]
          with ZipFile(output, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for source in sources:
                  if source.is_dir():
                      for path in sorted(source.rglob('*')):
                          if path.is_file():
                              archive.write(path, path.as_posix())
                  else:
                      archive.write(source, source.as_posix())
          PY
          sha256sum molnft-evidence/releases/GenesisL1_MOLNFT_Evidence_Block_13412747.zip \
            > molnft-evidence/releases/SHA256SUMS.txt

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-molnft-evidence-block-13412747
          path: |
            ${{ steps.snapshot.outputs.path }}
            molnft-evidence/latest.json
            molnft-evidence/README.md
            molnft-evidence/METHODOLOGY.md
            molnft-evidence/scripts/capture_molnft_snapshot.py
            molnft-evidence/releases/GenesisL1_MOLNFT_Evidence_Block_13412747.zip
            molnft-evidence/releases/SHA256SUMS.txt
            .github/workflows/capture-molnft-evidence.yml
          if-no-files-found: error
          retention-days: 90

      - name: Commit immutable snapshot and archive
        run: |
          git config user.name "GenesisL1 Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            molnft-evidence/latest.json \
            molnft-evidence/snapshots \
            molnft-evidence/releases \
            molnft-evidence/scripts/capture_molnft_snapshot.py
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "data: publish MOLNFT evidence at block 13412747"
            git pull --rebase origin main
            git push origin main
          fi
