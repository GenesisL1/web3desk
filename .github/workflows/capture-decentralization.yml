name: Capture GenesisL1 evidence snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 03 * * 1"
  push:
    branches: [main, decentralization-evidence]
    paths:
      - "decentralization/scripts/capture_validator_snapshot.py"
      - "decentralization/METHODOLOGY.md"
      - "molnft-evidence/scripts/capture_molnft_snapshot.py"
      - "molnft-evidence/METHODOLOGY.md"
      - ".github/workflows/capture-decentralization.yml"

permissions:
  contents: write

concurrency:
  group: genesisl1-evidence-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MOLNFT evidence dependencies
        if: github.event_name != 'schedule'
        run: python -m pip install --disable-pip-version-check requests eth-abi eth-utils msgpack

      - name: Capture consensus decentralization evidence
        run: python decentralization/scripts/capture_validator_snapshot.py

      - name: Verify consensus evidence checksums
        run: cd decentralization/latest && sha256sum -c SHA256SUMS.txt

      - name: Capture block-pinned MOLNFT evidence
        if: github.event_name != 'schedule'
        run: |
          python molnft-evidence/scripts/capture_molnft_snapshot.py \
            --block 13412747 \
            --expected-block-hash 19F42CD995E384E09D5CD4FB2751668E613D762DD1F22301D065EC84950F0F9A

      - name: Resolve MOLNFT snapshot directory
        if: github.event_name != 'schedule'
        id: molnft
        run: |
          SNAPSHOT=$(python - <<'PY'
          import json
          from pathlib import Path
          pointer = json.loads(Path('molnft-evidence/latest.json').read_text())
          print('molnft-evidence/snapshots/' + pointer['snapshot_directory'])
          PY
          )
          echo "path=${SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Verify MOLNFT evidence checksums
        if: github.event_name != 'schedule'
        run: cd "${{ steps.molnft.outputs.path }}" && sha256sum -c SHA256SUMS.txt

      - name: Upload consensus evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-decentralization-latest
          path: decentralization/latest
          if-no-files-found: error
          retention-days: 90

      - name: Upload MOLNFT evidence artifact
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-molnft-evidence-block-13412747
          path: |
            ${{ steps.molnft.outputs.path }}
            molnft-evidence/latest.json
            molnft-evidence/METHODOLOGY.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit evidence snapshots
        run: |
          git config user.name "GenesisL1 Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add decentralization/latest decentralization/snapshots
          if [ "${{ github.event_name }}" != "schedule" ]; then
            git add molnft-evidence/latest.json molnft-evidence/snapshots
          fi
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "data: publish reproducible GenesisL1 evidence snapshots"
            git push
          fi
